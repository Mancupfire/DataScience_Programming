version: '3.8'

services:
  iaq-project:
    build: .
    container_name: iaq_container
    ports:
      - "8501:8501"  # Port App
      - "8888:8888"  # Port Jupyter Notebook
    volumes:
      - .:/app  # Đồng bộ thư mục hiện tại vào /app trong container
    environment:
      - PYTHONUNBUFFERED=1
    # command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    restart: unless-stopped
